<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog - CharlieClip</title>

    <style>

        /* =========================================
           COLORS - EDIT THESE
           ========================================= */

        :root {
            --background: white;

            --bar-color: #a545a5;
            --bar-text: white;

            --post-title: #ef5a5a;
            --text-color: #111111;

            --max-width: 1100px;
        }


        /* =========================================
           RESET
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;

            background: var(--background);
            color: var(--text-color);

            font-family: Arial, sans-serif;
        }


        /* =========================================
           TOP BAR
           ========================================= */

        .topbar {
            width: 100%;
            height: 75px;

            background: var(--bar-color);

            display: flex;
            align-items: center;
        }


        .nav {
            width: 92%;
            max-width: var(--max-width);

            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            color: var(--bar-text);

            text-decoration: none;

            font-size: 24px;
            font-weight: bold;
        }


        .links {
            display: flex;
            align-items: center;
            gap: 35px;
        }


        .links a {
            color: var(--bar-text);

            text-decoration: none;

            font-size: 15px;
        }


        .links a:hover {
            text-decoration: underline;
        }


        /* =========================================
           BLOG AREA
           ========================================= */

        .blog {
            width: 92%;
            max-width: var(--max-width);

            margin: 0 auto;

            padding-top: 70px;
            padding-bottom: 100px;
        }


        /* =========================================
           POST
           ========================================= */

        .post {
            display: flex;

            align-items: center;

            gap: 60px;

            margin-bottom: 110px;
        }


        .post.reverse {
            flex-direction: row-reverse;
        }


        /* =========================================
           IMAGE
           ========================================= */

        .post-image {
            width: 50%;
        }


        .post-image img {
            display: block;

            width: 100%;
            height: 340px;

            object-fit: cover;

            background: #dddddd;
        }


        /* =========================================
           TEXT
           ========================================= */

        .post-text {
            width: 50%;
        }


        .post-text h2 {
            margin-top: 0;

            color: var(--post-title);

            font-size: 28px;

            line-height: 1.3;
        }


        .post-text p {
            font-size: 15px;

            line-height: 1.7;
        }


        .date {
            font-weight: bold;
        }


        .read-more {
            color: var(--post-title);
        }


        .read-more:hover {
            opacity: 0.75;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 750px) {

            .topbar {
                height: auto;
                padding: 20px 0;
            }


            .nav {
                flex-direction: column;
                gap: 15px;
            }


            .links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }


            .post,
            .post.reverse {
                flex-direction: column;
            }


            .post-image,
            .post-text {
                width: 100%;
            }


            .post-image img {
                height: auto;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================
         TOP BAR
         ===================================== -->

    <header class="topbar">

        <div class="nav">

            <a href="index.html" class="logo">
                CharlieClip
            </a>

<a href="games.html">Games</a>

</body>

</html>
